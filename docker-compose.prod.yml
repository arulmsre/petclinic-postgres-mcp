version: '3.8'
# Production override for Oracle Cloud Free Tier (ARM Ampere A1 VM)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set these env vars on the VM before deploying:
#   export DB_PASSWORD=<strong-password>
#   export GF_PASSWORD=<strong-password>

services:
  config-server:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=

  discovery-server:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tracing-server:9411/api/v2/spans

  customers-service:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - SPRING_PROFILES_ACTIVE=docker,postgres
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tracing-server:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-db:5432/petclinic?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_SQL_INIT_SCHEMA_LOCATIONS=classpath*:db/postgres/schema.sql
      - SPRING_SQL_INIT_DATA_LOCATIONS=classpath*:db/postgres/data.sql
      - SPRING_SQL_INIT_MODE=always

  visits-service:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - SPRING_PROFILES_ACTIVE=docker,postgres
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tracing-server:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-db:5432/petclinic?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_SQL_INIT_SCHEMA_LOCATIONS=classpath*:db/postgres/schema.sql
      - SPRING_SQL_INIT_DATA_LOCATIONS=classpath*:db/postgres/data.sql
      - SPRING_SQL_INIT_MODE=always

  vets-service:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - SPRING_PROFILES_ACTIVE=docker,postgres
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tracing-server:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-db:5432/petclinic?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_SQL_INIT_SCHEMA_LOCATIONS=classpath*:db/postgres/schema.sql
      - SPRING_SQL_INIT_DATA_LOCATIONS=classpath*:db/postgres/data.sql
      - SPRING_SQL_INIT_MODE=always

  api-gateway:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tracing-server:9411/api/v2/spans

  admin-server:
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tracing-server:9411/api/v2/spans

  app-db:
    restart: unless-stopped
    environment:
      - POSTGRES_DB=petclinic
      - POSTGRES_USER=petclinic
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  grafana-db:
    restart: unless-stopped
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=${GF_PASSWORD}

  grafana-server:
    restart: unless-stopped
    environment:
      - GF_DATABASE_PASSWORD=${GF_PASSWORD}
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_NAME=grafana

  prometheus-server:
    restart: unless-stopped

  loki:
    restart: unless-stopped

  tracing-server:
    restart: unless-stopped
