##################### Spring Petclinic Microservices Grafana Configuration #####################

# possible values : production, development
app_mode = development

#################################### Paths ####################################
[paths]
# folder that contains provisioning config files that grafana will apply on startup and while running.
provisioning = /etc/grafana/provisioning

#################################### Server ####################################
[server]
# enable gzip
enable_gzip = true

#################################### Database ####################################
# Grafana metadata (dashboards, users, alert rules, annotations) stored in Supabase PostgreSQL
[database]
type = postgres
host = host.docker.internal:5433
name = postgres
user = postgres
password = ${GF_DATABASE_PASSWORD}
ssl_mode = require

#################################### Anonymous Auth ##########################
# Anonymous authentication has been enabled in the Petclinic sample with Admin role
# Do not do that in Production environment
[auth.anonymous]
# enable anonymous access
enabled = true

# specify organization name that should be used for unauthenticated users
org_name = Main Org.

# specify role for unauthenticated users
org_role = Admin
