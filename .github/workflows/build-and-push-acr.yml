name: Build and Push to Azure Container Registry

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACR_NAME: capsreacr
  ACR_LOGIN_SERVER: capsreacr.azurecr.io
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push config-server
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-config-server:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-config-server-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-config-server
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-config-server:${{ env.IMAGE_TAG }}

    - name: Build and push discovery-server
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-discovery-server:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-discovery-server-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-discovery-server
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-discovery-server:${{ env.IMAGE_TAG }}

    - name: Build and push api-gateway
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-api-gateway:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-api-gateway-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-api-gateway
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-api-gateway:${{ env.IMAGE_TAG }}

    - name: Build and push customers-service
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-customers-service:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-customers-service-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-customers-service
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-customers-service:${{ env.IMAGE_TAG }}

    - name: Build and push visits-service
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-visits-service:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-visits-service-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-visits-service
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-visits-service:${{ env.IMAGE_TAG }}

    - name: Build and push vets-service
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-vets-service:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-vets-service-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-vets-service
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-vets-service:${{ env.IMAGE_TAG }}

    - name: Build and push admin-server
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-admin-server:${{ env.IMAGE_TAG }} \
          --build-arg ARTIFACT_NAME=target/spring-petclinic-admin-server-3.2.4.jar \
          -f docker/Dockerfile \
          ./spring-petclinic-admin-server
        docker push ${{ env.ACR_LOGIN_SERVER }}/spring-petclinic-admin-server:${{ env.IMAGE_TAG }}

    - name: Summary
      run: |
        echo "✅ All 7 services built and pushed successfully!"
        echo "Images available at: ${{ env.ACR_LOGIN_SERVER }}"
